<main class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 py-16 px-4">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-4xl font-bold text-white mb-6">Contact</h1>
    <div class="bg-slate-800 rounded-lg p-8">
      <form class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-medium text-slate-300 mb-2">Name</label>
          <input
            type="text"
            id="name"
            class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="Your name"
          />
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email</label>
          <input
            type="email"
            id="email"
            class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="your@email.com"
          />
        </div>
        <div>
          <label for="message" class="block text-sm font-medium text-slate-300 mb-2">Message</label>
          <textarea
            id="message"
            rows="4"
            class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="Your message"
          ></textarea>
        </div>
        <button
          type="submit"
          class="w-full px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors font-medium"
        >
          Send Message
        </button>
      </form>
    </div>
  </div>
</main>
